name: Daily episode

on:
  schedule:
    # 5 PM Toronto = 21:00 UTC in summer (EDT) and 22:00 UTC in winter (EST).
    # Both run; the script only acts after 5 PM local and once per day.
    - cron: "5 21 * * *"
    - cron: "5 22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Make an extra episode now (the 5 PM episode still runs)"
        type: boolean
        default: true
      rerender:
        description: "Only re-record the audio for this episode id (e.g. 2026-11-06) from its saved script"
        type: string
        default: ""

concurrency:
  group: daily-episode
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - name: Make episode
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.rerender }}" ]; then
            python -m podcast.main --rerender "${{ inputs.rerender }}"
          else
            python -m podcast.main ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}
          fi
      - name: Keep the script for reference
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit feed
        run: |
          git config user.name "podcast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scripts
          git diff --cached --quiet || (git commit -m "Episode $(TZ=America/Toronto date +%F)" && git push)
