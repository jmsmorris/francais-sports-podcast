name: Daily episode

# The Claude cloud routine ("Le sport en français facile - script") scrapes Radio-Canada at
# 11 PM Toronto time, writes the French script, and pushes scripts/<id>.json. That push
# starts this workflow, which only turns the script into audio and updates the feed.
# No Anthropic API key is needed for that; only the Google TTS key.
on:
  push:
    branches: [main]
    paths: ["scripts/*.json"]
  schedule:
    # Safety net: if the routine's push didn't start this workflow, voice any waiting script.
    # With nothing waiting, this exits in about a minute without calling Google.
    - cron: "20 6 * * *"
  workflow_dispatch:
    inputs:
      legacy:
        description: "Fallback: scrape and write the script with the Anthropic API instead (needs ANTHROPIC_API_KEY)"
        type: boolean
        default: false
      force:
        description: "With legacy: make an extra episode now"
        type: boolean
        default: false
      rerender:
        description: "Only re-record the audio for this episode id (e.g. 2026-11-06) from its saved script"
        type: string
        default: ""

concurrency:
  group: daily-episode
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - name: Make episode audio and feed
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          RERENDER: ${{ inputs.rerender }}
          LEGACY: ${{ inputs.legacy }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ -n "$RERENDER" ]; then
            python -m podcast.main --rerender "$RERENDER"
          elif [ "$LEGACY" = "true" ]; then
            if [ "$FORCE" = "true" ]; then python -m podcast.main --force; else python -m podcast.main; fi
          else
            python -m podcast.main --render
          fi
      - name: Keep the audio script for reference
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit feed
        run: |
          git config user.name "podcast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs scripts pending
          git diff --cached --quiet || {
            git commit -m "Episode $(python -c "import json;print(max(json.load(open('docs/episodes.json')),key=lambda e:e['published']).get('id','update'))")"
            git pull --rebase -q
            git push
          }
